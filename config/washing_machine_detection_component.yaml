/**/washing_machine_detection:
  ros__parameters:
    # PointCloud2 topic to process
    input_topic: "preprocessor/filtered_cloud"
    
    # Coordinates in ROI and output TF will be relative to this frame
    base_frame: "base_footprint"
    
    # Region of Interest filtering (relative to base_frame)
    roi:
      x_min: 0.5   # Minimum distance in front of robot
      x_max: 3.0   # Maximum distance to consider
      y_min: -1.0  # Right boundary
      y_max: 1.0   # Left boundary
      z_min: 0.1   # Bottom boundary (above floor)
      z_max: 1.6   # Top boundary (above machine)

    # RANSAC Plane segmentation (to find the washing machine face)
    plane:
      dist_threshold: 0.03  # Max distance (m) for a point to be considered part of the plane

    # RANSAC Circle segmentation (to find the door rim)
    circle:
      dist_threshold: 0.02  # Max distance (m) for a point to be considered part of the circle
      radius_min: 0.20      # Minimum expected radius of the door (m)
      radius_max: 0.24      # Maximum expected radius of the door (m)

    # Temporal smoothing (Exponential Moving Average)
    # 1.0 = No smoothing (pure latest detection)
    # 0.1 = High smoothing (very stable, but slow to update)
    smoothing_alpha: 0.2

    # TF Placement relative to the detected circle rim
    # Offset in degrees along the rim (0.0 is the top-most point of the door)
    # Positive values rotate the TF clockwise when looking at the door
    rotation_offset: 0.0

    # Depth offset along the surface normal (m)
    # Positive values move the TF away from the washer (towards the robot)
    depth_shift: 0.05

    # Closed-drum front-face frame. Broadcast from the front-plane fit BEFORE the
    # porthole circle fit, so it publishes even when the door is CLOSED (no
    # visible porthole). Gives ApproachWasher a true surface normal to square the
    # base to the door, instead of facing the SAM3 centroid.
    closed_drum:
      enable: true
      frame: "closed_drum"
      # Min dot(inward_normal, robot->face_dir) to accept the plane as the FRONT
      # face. 1.0 = robot dead-on; 0.5 ~= within 60deg. Rejects side-wall fits.
      min_align: 0.5

    # QoS reliability ("reliable" or "best_effort").
    #   cloud_reliability     : filtered input cloud subscription. Must match the
    #     preprocessor's output_reliability.
    #   debug_pub_reliability : debug cloud publisher (visualization).
    cloud_reliability: "best_effort"
    debug_pub_reliability: "best_effort"
