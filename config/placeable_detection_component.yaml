placeable_detection:
  ros__parameters:
    input_topic: "cloud_filtered"
    base_frame: "D435i/camera/_depth_frame"

    # Passthrough Filter
    place_x_min: 0.3
    place_x_max: 1.2
    place_y_min: -0.8
    place_y_max: 0.8
    place_z_min: 0.4
    place_z_max: 1.1
    
    # Safety Logic
    search_interval: 0.02      # Grid density
    obstacle_tolerance: 0.12   # Radius needed for an object
    edge_margin: 0.05          # Distance from table edge
    plane_dist_threshold: 0.02

    # RANSAC Parameters
    ransac_max_iterations: 100
