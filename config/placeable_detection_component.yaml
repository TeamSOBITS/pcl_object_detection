/**/placeable_detection:
  ros__parameters:
    input_topic: "preprocessor/filtered_cloud"
    base_frame: "base_footprint"

    # Passthrough Filter
    place_x_min: 0.25
    place_x_max: 1.0
    place_y_min: -0.5
    place_y_max: 0.5
    place_z_min: -0.5
    place_z_max: 0.5
    
    # Safety Logic
    search_interval: 0.02      # Grid density
    obstacle_tolerance: 0.1   # Radius needed for an object
    edge_margin: 0.05          # Distance from table edge
    plane_dist_threshold: 0.02 # Distance from plane to consider as "on the table"

    # RANSAC Parameters
    ransac_max_iterations: 100

    # QoS reliability ("reliable" or "best_effort").
    #   cloud_reliability          : filtered input cloud subscription. Must match
    #     the preprocessor's output_reliability.
    #   detections_pub_reliability : detection output publisher. Keep "reliable"
    #     so downstream consumers never miss a detection.
    #   debug_pub_reliability      : debug cloud publisher (visualization).
    cloud_reliability: "best_effort"
    detections_pub_reliability: "reliable"
    debug_pub_reliability: "best_effort"
