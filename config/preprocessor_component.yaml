/**/preprocessor:
  ros__parameters:
    input_topic: "head_camera/depth/points"
    # Private topic ("~/...") expands to <node_name>/filtered_cloud, i.e.
    # /sobit_home/preprocessor/filtered_cloud. Namespacing under the node name
    # avoids colliding with moveit's /sobit_home/filtered_cloud.
    output_topic: "~/filtered_cloud"
    base_frame: "base_footprint"

    # Passthrough Filter
    voxel_leaf_size: 0.02
    x_min: 0.2
    x_max: 2.0
    y_min: -1.0
    y_max: 1.0
    z_min: 0.0
    z_max: 1.0

    # QoS reliability ("reliable" or "best_effort").
    #   input_reliability  : subscription to the raw camera point cloud.
    #     Must match the source. The Gazebo sim head camera
    #     (/sobit_home/head_camera/depth/points, node head_camera_point_cloud_xyz)
    #     publishes BEST_EFFORT, so this must be "best_effort" or the
    #     subscription is QoS-incompatible and receives ZERO frames.
    #   output_reliability : publisher of the filtered cloud consumed by the
    #     detection nodes. Keep "reliable" so detectors never drop frames.
    input_reliability: "best_effort"
    output_reliability: "reliable"
