preprocessor:
  ros__parameters:
    input_topic: "/D435i/camera/depth/color/points"
    output_topic: "cloud_filtered"
    base_frame: "D435i/camera/_depth_frame"

    # Passthrough Filter
    voxel_leaf_size: 0.025
    x_min: 0.0
    x_max: 1.0
    y_min: -3.0
    y_max: 3.0
    z_min: 0.0
    z_max: 3.0
