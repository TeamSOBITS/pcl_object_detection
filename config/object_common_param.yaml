pcl_object_detection/pcl_object_detection:
  ros__parameters:
    # Input and Output Settings
    pointcloud_topic_name : /head_rgbd_sensor/depth_registered/points
    base_frame_name : base_footprint
    publish_cloud_detection_range : true
    publish_cloud_object : true
    publish_pose_array : true
    use_tf : true

    # Voxel Grid Downsampling
    use_voxel : True
    leaf_size : 0.01

    # Euclidean Clustering
    cluster_tolerance : 0.03
    min_cluster_point_size : 100
    max_cluster_point_size : 10000

    # RANSAC Plane Segmentation
    threshold_distance : 0.03
    probability : 0.95

    # Object Size Filtering
    object_size_x_min : 0.00
    object_size_x_max : 0.40
    object_size_y_min : 0.00
    object_size_y_max : 0.40
    object_size_z_min : 0.00
    object_size_z_max : 0.40

    # Vertical Structure Detection
    vertical_structure:
      slice_thickness: 0.02
      xy_cell_size: 0.03
      check_height: 0.20
      required_continuity: 0.15
      min_points_per_cell: 3
      initial_min_x: .inf
      initial_max_x: -.inf
      initial_min_y: .inf
      initial_max_y: -.inf
      initial_min_z: .inf