/**/table_detection:
  ros__parameters:
    input_topic: "cloud_filtered"
    base_frame: "base_footprint"

    # Passthrough Filter
    table_height_min: -0.5
    table_height_max: 0.5
    plane_distance_threshold: 0.05
    
    # Clustering
    cluster_tolerance: 0.01
    min_cluster_size: 100
    max_cluster_size: 5000

    # RANSAC Parameters
    ransac_max_iterations: 100
    
    # Object Size Filters
    object_size_x_min: 0.02
    object_size_x_max: 0.40
    object_size_y_min: 0.02
    object_size_y_max: 0.40
    object_size_z_min: 0.02
    object_size_z_max: 0.50
